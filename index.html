   Fonti: BPHR 2019 (BPIAR) 2.4.3 datazione, 6.3.1-6.3.2 durate indicative.
   ===================================================================== */
function piuGiorni(k,n){ var d=dataDa(k); d.setDate(d.getDate()+n); return chiaveGiorno(d); }
function dataCorta(k){ var d=dataDa(k); return d.getDate()+'.'+(d.getMonth()+1)+'.'; }
function dataPiena(k){ var d=dataDa(k); return ('0'+d.getDate()).slice(-2)+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+d.getFullYear(); }
function quandoEntro(k){ var oggi=chiaveGiorno(new Date()); return k===oggi?'oggi':k===piuGiorni(oggi,1)?'domani':k<oggi?'scadenza '+dataCorta(k)+' passata':GIORNI_SETT[dataDa(k).getDay()]+' '+dataCorta(k); }
function inizialiBase(n){ return String(n||'').trim().split(/\s+/).filter(Boolean).map(function(p){return p.charAt(0).toUpperCase();}).join('').slice(0,3); }
/* due persone con le stesse iniziali (Nico e Nina Prova) non hanno lo stesso visto: si aggiunge la seconda lettera del nome */
function nomiNoti(){ var l=(S.locale&&S.locale.brigata||[]).map(function(p){return p.nome;}), R=S.registro||{}; ['temp','cuore','pulizie','merci'].forEach(function(c){ (R[c]||[]).forEach(function(x){ l.push(x.chi); }); }); (S.pronte||[]).forEach(function(p){ l.push(p.chi); }); return unici(l.filter(function(x){return String(x||'').trim();}).map(function(x){return String(x).trim();})); }
function iniziali(n){ var b=inizialiBase(n), t=String(n||'').trim(); if(!b) return ''; var uguali=nomiNoti().filter(function(x){return x!==t&&inizialiBase(x)===b;}); if(!uguali.length) return b;
  var codice=function(nome,n){ var p=String(nome).trim().split(/\s+/); return p[0].charAt(0).toUpperCase()+p[0].slice(1,n).toLowerCase()+p.slice(1).map(function(w){return w.charAt(0).toUpperCase();}).join(''); };
  for(var n=2;n<=t.split(/\s+/)[0].length;n++){ var c=codice(t,n); if(!uguali.some(function(x){return codice(x,n)===c;})) return c; } return t; }
/* chi lavora in cucina: firma etichette e registro con le iniziali, senza account */
function brigata(){ var l=(S.locale.brigata||[]).filter(function(p){return String(p.nome||'').trim();}); if(!l.length&&S.persona) l=[{nome:S.persona,ruolo:'Chef'}]; return l; }
function chiSono(){ var b=brigata(); if(S.chi&&b.some(function(p){return p.nome===S.chi;})) return S.chi; return b.length===1?b[0].nome:''; }

/* durata proposta dalla BPHR 6.3.1 secondo il tipo di ricetta: indicativa, lo chef conferma */
function durataProposta(r){ if(!r) return null; var nome=piega(r.nome||''), t=piega((r.nome||'')+' '+(r.passi||[]).join(' '));
  if(/servire subito|subito in tavola|servire immediatamente/.test(t)) return {g:0,perche:'la ricetta dice di servire subito: in giornata',fonte:'ricetta'};
  if(/\b(tartare|carpaccio|crud[oaie]|tiramis|maionese)/.test(nome)) return {g:0,perche:'piatti con uova, carne o pesce crudi: in giornata'};
  if(/(vinaigrette|salsa per insalat|condimento per insalat)/.test(nome)) return {g:6,perche:'salse per insalata: produzione + 6 giorni'};
  if(/\binsalat/.test(nome)) return {g:2,perche:'insalate condite: produzione + 2 giorni'};
  if(r.portata==='Dolci') return null; /* la BPHR dà «in giornata» solo per i dessert delicati: decide lo chef */
  if(r.portata==='Basi'||/\b(cuoc|cuoce|rosol|bollir|brasa|forno|inforn|stufa|soffrigg|tosta|sobbol|lessa|frigg|salta)/.test(t)) return {g:2,perche:'piatti cotti in anticipo, salse e verdure cotte: produzione + 2 giorni'};
  return null; }
function durataDi(r){ if(!r) return null; if(r.conserva!=null&&r.conserva!=='') return {g:+r.conserva,confermata:true}; var p=durataProposta(r); return p?{g:p.g,perche:p.perche,proposta:true,fonte:p.fonte||'BPHR'}:null; }
/* punti critici per chi conserva una preparazione cotta (BPHR 2.4.4, 2.4.7) */
function piattoCaldo(r){ return ['Basi','Primi','Secondi','Zuppe','Contorni'].indexOf(r.portata)>=0&&!/(tonnat|carpione|insalat|fredd|gelat|crud|aspic)/.test(piega(r.nome||'')); }
function puntiCritici(r){ var d=durataDi(r); if(!d||!(d.g>0)) return ''; var cotta=r.portata==='Basi'||/\b(cuoc|cuoce|rosol|bollir|brasa|forno|inforn|stufa|soffrigg|sobbol|lessa)/.test(piega((r.passi||[]).join(' '))); if(!cotta) return '';
  var caldo=piattoCaldo(r)&&r.portata!=='Basi'; /* le basi non si servono: la rigenerazione vale per il piatto */
  return '<p class="auto-nota punti-critici"><b>Per conservarla:</b> raffredda da 65 °C a meno di 5 °C in 90 minuti, poi in frigo a 5 °C al massimo'+(caldo?'. Per servirla calda, scalda a 70 °C al cuore per almeno 2 minuti (BPHR 2.4.4, 2.4.7).':' (BPHR 2.4.4).')+'</p>'; }
function testoDurata(g){ return g===0?'in giornata':g===1?'1 giorno':g===7?'1 settimana':g===14?'2 settimane':g+' giorni'; }

/* preparazioni pronte: {id,ric,q,fatto,entro,tipo:'frigo'|'congelato'|'scongelato',chi} — un solo elenco per Da preparare, spesa ed etichette */
function unitaPronta(r){ var x=resaDi(r); return x==='litri'?'l':x==='pezzi'?'pz':'porz'; }
function qPronta(r,q){ var u=unitaPronta(r); return u==='l'?qLitri(q):u==='pz'?fmt(q)+(q===1?' pezzo':' pezzi'):fmt(q)+(q===1?' porzione':' porzioni'); }
/* con un'ora limite (scongelato «entro sabato alle 11.00») l'ultimo giorno conta solo se l'ora copre tutti i servizi di quel giorno: per la sicurezza si sta stretti */
function minutiAdesso(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function fineServizi(k){ var sv=serviziDi(k).filter(function(x){var m=menuDi(k,x);return m&&m.piatti.length;}); return sv.length?Math.max.apply(null,sv.map(function(x){var o=orariDi(k,x);return o?minutiOra(o[1]):24*60;})):0; }
function prontaValida(p,k){ if(p.tipo==='congelato'||p.fatto>k||p.entro<k||!(p.q>0)) return false; if(p.fatto===k&&p.oraFatto!=null&&p.oraFatto>=fineServizi(k)) return false; /* fatta la sera: vale dal giorno dopo */ if(p.oraEntro&&p.entro===k) return minutiOra(p.oraEntro)>=fineServizi(k); return true; }
function prontaScaduta(p,oggi){ if(p.tipo==='congelato') return false; return p.entro<oggi||(p.entro===oggi&&!!p.oraEntro&&adessoMin()>=minutiOra(p.oraEntro)); }
/* le preparazioni usate dal menu dei giorni passati si tolgono da sole, come il conto di «Da preparare»; si possono rimettere */
function aggiornaConsumi(){ var oggi=chiaveGiorno(new Date()); if(!S.consumoFatto){ S.consumoFatto=oggi; return; } if(S.consumoFatto>=oggi) return;
  var usato={}, d=S.consumoFatto, n=0; while(d<oggi&&n<31){ produzioneGiorno(d,usato); d=piuGiorni(d,1); n++; }
  var tolte=[]; (S.pronte||[]).forEach(function(p){ var u=usato[p.id]||0; if(u>1e-9){ tolte.push({id:p.id,ric:p.ric,q:Math.min(u,p.q),copia:JSON.parse(JSON.stringify(p))}); p.q=Math.round((p.q-u)*100)/100; } });
  S.pronte=S.pronte.filter(function(p){return p.q>1e-9;}); S.consumati=tolte.length?{dal:S.consumoFatto,voci:tolte}:null; S.consumoFatto=oggi; }
function rimettiConsumi(id){ var c=S.consumati; if(!c) return ''; var nome=''; c.voci.filter(function(v){return !id||v.id===id;}).forEach(function(v){ var p=S.pronte.filter(function(x){return x.id===v.id;})[0]; if(p) p.q=Math.round((p.q+v.q)*100)/100; else S.pronte.push(v.copia); nome=(ric(v.ric)||{}).nome||''; });
  c.voci=c.voci.filter(function(v){return id&&v.id!==id;}); if(!c.voci.length) S.consumati=null; return nome; }
function disponibile(id,k){ return (S.pronte||[]).filter(function(p){return p.ric===id&&prontaValida(p,k);}).reduce(function(a,p){return a+p.q;},0); }
function entroPer(r,tipo,fatto){ if(tipo==='congelato') return piuGiorni(fatto,90); if(tipo==='scongelato') return piuGiorni(fatto,2); var d=durataDi(r); return piuGiorni(fatto,d?d.g:0); }
function aggiungiPronta(r,q,tipo,chi,giorni){ var oggi=chiaveGiorno(new Date());
  if(giorni!=null&&tipo==='frigo'){ r.conserva=giorni; }
  var p={id:'p'+Date.now()+Math.floor(Math.random()*1000),ric:r.id,q:q,fatto:oggi,oraFatto:minutiAdesso(),entro:entroPer(r,tipo,oggi),tipo:tipo,chi:chi||chiSono()}; p.sigla=iniziali(p.chi); S.pronte.push(p); return p; }
function togliPronta(id){ S.pronte=S.pronte.filter(function(p){return p.id!==id;}); }

/* porzioni previste: un dato solo, per lista della spesa e Da preparare (si ricordano per ricetta; 10 la prima volta) */
function previsteDi(key,r){ if(S.previste[key]==null) S.previste[key]=S.previste['r|'+r.id]!=null?S.previste['r|'+r.id]:10; return S.previste[key]; }
function piattiDelGiorno(k){ var l=[], d={k:k,nome:k===chiaveGiorno(new Date())?'Oggi':''}; if(chiuso(k)) return l;
  serviziDi(k).forEach(function(s){ var m=menuDi(k,s); if(!m) return; var quando=nomeServ(s);
    m.piatti.forEach(function(p){ if(!p.ric||!ric(p.ric)){ l.push({key:null,r:null,nome:infoPiatto(p).nome,porz:0,quando:quando,s:s}); return; }
      [p.ric,p.alt].forEach(function(id,j){ var r=id&&ric(id); if(!r) return; var key=k+'|'+s+'|'+p.uid+'|'+j; l.push({key:key,r:r,nome:r.nome,porz:previsteDi(key,r),quando:quando,s:s}); }); }); });
  return l; }
/* quanto preparare per un giorno: piatti (porzioni) e basi (litri), meno quello che è già pronto e valido quel giorno */
/* quanto resta di una preparazione pronta, tolto quello che i giorni prima hanno già usato */
function disponibileU(id,k,usato){ return (S.pronte||[]).filter(function(p){return p.ric===id&&prontaValida(p,k);}).reduce(function(a,p){return a+Math.max(0,p.q-(usato[p.id]||0));},0); }
function consuma(id,k,q,usato){ (S.pronte||[]).filter(function(p){return p.ric===id&&prontaValida(p,k);}).sort(function(a,b){return a.entro<b.entro?-1:a.entro>b.entro?1:0;}).forEach(function(p){ if(q<=1e-9) return; var resto=Math.max(0,p.q-(usato[p.id]||0)), x=Math.min(resto,q); usato[p.id]=(usato[p.id]||0)+x; q-=x; }); }
/* quanto preparare per un giorno: i giorni prima, da oggi, usano le pronte per primi (una preparazione non vale due volte) */
function produzione(k){ var oggi=chiaveGiorno(new Date()), usato={}, res=null, prima=giorni().map(function(d){return d.k;}).filter(function(x){return x>=oggi&&x<k;});
  prima.forEach(function(d){ produzioneGiorno(d,usato); }); return produzioneGiorno(k,usato); }
function produzioneGiorno(k,usato){ var ps=piattiDelGiorno(k), piatti={}, ordine=[];
  ps.forEach(function(x){ if(!x.r) return; if(!piatti[x.r.id]){ piatti[x.r.id]={r:x.r,porz:0,quando:[]}; ordine.push(x.r.id); } piatti[x.r.id].porz+=x.porz; if(piatti[x.r.id].quando.indexOf(x.quando)<0) piatti[x.r.id].quando.push(x.quando); });
  var lp=ordine.map(function(id){ var p=piatti[id]; p.pronte=disponibileU(id,k,usato); p.daFare=Math.max(0,Math.round((p.porz-p.pronte)*100)/100); return p; });
  /* basi: a giri, perché una base può stare dentro un'altra; si ferma quando i numeri non cambiano */
  var daFareB={}, serve={}, basiUnita=[];
  for(var giro=0;giro<7;giro++){ var nuovo={};
    var add=function(r,fattore,prof){ if(prof>6||!(fattore>0)) return; r.ingr.forEach(function(i){ if(!i.base) return; var b=ric(i.base); if(!b) return; var lt=litriBase(i,b);
        if(lt==null||!(b.porzioni>0)){ if(basiUnita.indexOf(String(i.nome||b.nome))<0) basiUnita.push(String(i.nome||b.nome)); return; } nuovo[b.id]=(nuovo[b.id]||0)+lt*fattore; }); };
    lp.forEach(function(p){ if(p.daFare>0&&p.r.porzioni>0) add(p.r,p.daFare/p.r.porzioni,0); });
    Object.keys(daFareB).forEach(function(id){ var b=ric(id); if(b&&daFareB[id]>0) add(b,daFareB[id]/b.porzioni,1); });
    var cambiato=false; Object.keys(nuovo).forEach(function(id){ var df=Math.max(0,nuovo[id]-disponibileU(id,k,usato)); if(Math.abs((daFareB[id]||0)-df)>1e-9||serve[id]==null||Math.abs(serve[id]-nuovo[id])>1e-9) cambiato=true; daFareB[id]=df; serve[id]=nuovo[id]; });
    if(!cambiato) break; }
  /* in litri si arrotonda in su al decilitro, e «da fare» = servono − pronte con gli stessi numeri che si leggono */
  var basi=Object.keys(serve).map(function(id){ var b=ric(id), litri=resaDi(b)==='litri', sv=litri?Math.ceil(serve[id]*10-1e-9)/10:Math.ceil(serve[id]-1e-9), pr=disponibileU(id,k,usato);
    return {r:b,serve:sv,pronte:pr,daFare:Math.max(0,Math.round((sv-pr)*100)/100),congelate:(S.pronte||[]).filter(function(p){return p.ric===id&&p.tipo==='congelato';})}; });
  lp.forEach(function(p){ consuma(p.r.id,k,Math.min(p.porz,p.pronte),usato); }); basi.forEach(function(b){ consuma(b.r.id,k,Math.min(b.serve,b.pronte),usato); });
  return {piatti:lp,basi:basi,senza:ps.filter(function(x){return !x.r;}).map(function(x){return x.nome;}),basiUnita:basiUnita}; }
/* litri arrotondati come in cucina: a 0,5 dl sotto il litro, a 0,1 l sopra */
/* quantità di una preparazione nella sua resa: litri, pezzi o porzioni */
function qBase(r,q){ var x=resaDi(r); if(x==='litri'||!x&&r.portata==='Basi') return qLitri(q); var n=Math.ceil(q-1e-9); return n+(x==='pezzi'?(n===1?' pezzo':' pezzi'):(n===1?' porzione':' porzioni')); }
function qLitri(l){ if(!(l>0)) return '0 l'; return l<1?fmt(Math.max(0.5,Math.ceil(l*20)/2))+' dl':fmt(Math.ceil(l*10)/10)+' l'; }

/* righe guida per il giorno di oggi nel Menu: cosa preparare, cosa scade */
/* il giorno per cui si prepara: oggi fino alla fine dell'ultimo servizio con piatti, poi il prossimo giorno aperto */
function giornoDaPreparare(){ var oggi=chiaveGiorno(new Date()), sv=serviziDi(oggi).filter(function(x){var m=menuDi(oggi,x);return m&&m.piatti.length;});
  var fine=sv.length?Math.max.apply(null,sv.map(function(x){var o=orariDi(oggi,x);return o?minutiOra(o[1]):24*60;})):0;
  return chiuso(oggi)||adessoMin()>=fine?(prossimaApertura(oggi)||oggi):oggi; }
function guidaCucina(k){ var oggi=chiaveGiorno(new Date()); if(k!==oggi&&k!==piuGiorni(oggi,1)) return ''; var h='';
  /* dopo l'ultimo servizio di oggi conta il prossimo giorno aperto */
  var kp=k===oggi?giornoDaPreparare():k;
  var pr=produzione(kp), da=pr.basi.filter(function(b){return b.daFare>0;});
  if(da.length) h+='<p class="guida da-fare"><b>'+(kp===oggi?'Da preparare oggi:':kp===piuGiorni(oggi,1)?'Da preparare per domani:':'Da preparare per '+GIORNI_SETT[dataDa(kp).getDay()]+':')+'</b> '+esc(da.map(function(b){return b.r.nome.toLowerCase()+' '+qBase(b.r,b.daFare);}).join(', '))+'. <button class="link" data-apri-preparare="'+kp+'">Apri</button></p>';
  if(kp!==oggi){ var dasc=pr.basi.filter(function(b){return b.daFare>0&&b.congelate.length;}); if(dasc.length) h+='<p class="guida da-fare"><b>Per '+(kp===piuGiorni(oggi,1)?'domani':GIORNI_SETT[dataDa(kp).getDay()])+', da scongelare in frigo stasera:</b> '+esc(dasc.map(function(b){return b.r.nome.toLowerCase()+' '+qPronta(b.r,b.congelate.reduce(function(a,p){return a+p.q;},0));}).join(', '))+'. <button class="link" data-apri-preparare="'+kp+'">Apri</button></p>'; }
  if(k===oggi){ var prossimo=prossimaApertura(oggi), usatoNA={}, dNA=oggi; while(prossimo&&dNA<prossimo){ produzioneGiorno(dNA,usatoNA); dNA=piuGiorni(dNA,1); }
    var nonArriva=(S.pronte||[]).filter(function(p){return p.tipo==='frigo'&&ric(p.ric)&&prossimo&&p.entro<prossimo&&p.entro>oggi&&p.q-(usatoNA[p.id]||0)>1e-9;}).map(function(p){ return {ric:p.ric,q:Math.round((p.q-(usatoNA[p.id]||0))*100)/100,entro:p.entro}; });
    if(nonArriva.length) h+='<p class="guida da-fare"><b>Non arriva alla riapertura:</b> '+esc(nonArriva.map(function(p){return ric(p.ric).nome.toLowerCase()+' ('+qPronta(ric(p.ric),p.q)+', entro '+quandoEntro(p.entro)+')';}).join(', '))+'. Usala oggi o congelala. <button class="link" data-apri-preparare="'+k+'">Apri</button></p>'; }
  if(k===oggi){ var sc=(S.pronte||[]).filter(function(p){return p.tipo!=='congelato'&&p.entro<=oggi&&ric(p.ric);});
    if(sc.length&&kp!==oggi) h+='<p class="guida da-fare"><b>Scade oggi, a servizio finito:</b> '+esc(sc.map(function(p){return ric(p.ric).nome.toLowerCase()+' ('+qPronta(ric(p.ric),p.q)+')';}).join(', '))+'. Usata o buttata? <button class="link" data-apri-preparare="'+k+'" data-sezione="scade">Segna</button></p>';
    else if(sc.length) h+='<p class="guida da-fare"><b>'+(sc.some(function(p){return prontaScaduta(p,oggi);})?'Scadute o in scadenza:':'Scade oggi:')+'</b> '+esc(sc.map(function(p){return ric(p.ric).nome.toLowerCase()+' ('+qPronta(ric(p.ric),p.q)+')';}).join(', '))+'. <button class="link" data-apri-preparare="'+k+'" data-sezione="scade">Vedi</button></p>'; }
  return h; }

/* ---------- la finestra «Da preparare» ---------- */
function apriPreparare(kIniziale,sezione){
  chiudiToast(); var velo=document.createElement('div'); velo.className='velo'; S.pronte=S.pronte||[];
  var oggi=chiaveGiorno(new Date());
  var conPiatti=giorni().filter(function(d){ return !chiuso(d.k)&&serviziDi(d.k).some(function(s){var m=menuDi(d.k,s);return m&&m.piatti.length;}); });
  var kd=giornoDaPreparare(), k=kIniziale&&conPiatti.some(function(d){return d.k===kIniziale;})?kIniziale:(conPiatti.filter(function(d){return d.k===kd;})[0]||conPiatti.filter(function(d){return d.k>=kd;})[0]||conPiatti[0]||{k:oggi}).k;
  var aperto=null, scongelo=null; /* la riga con il modulo «Pronto» aperto: 'b|id' o 'p|id'; la preparazione da scongelare */
  var disegnaF=function(){ var pr=produzione(k), oggiK=oggi;
    var scadute=(S.pronte||[]).filter(function(p){return ric(p.ric)&&prontaScaduta(p,oggiK);});
    var pronteL=(S.pronte||[]).filter(function(p){return ric(p.ric)&&!prontaScaduta(p,oggiK);}).sort(function(a,b){return a.entro<b.entro?-1:a.entro>b.entro?1:0;});
    var giornoTesto=function(kk){ var d=giorni().filter(function(x){return x.k===kk;})[0]; return d?giornoCorto(d):dataCorta(kk); };
    var h='<div class="foglio preparare" role="dialog" aria-modal="true" aria-labelledby="t-prep"><h2 id="t-prep">Da preparare</h2>'+
      '<p>Dai piatti del menu e dalle porzioni previste. Quello che è già pronto è già tolto.</p>'+
      (conPiatti.length?'<div class="gruppo"><h3>Giorno</h3><div class="filtri">'+conPiatti.map(function(d){ return '<button class="chipf" data-pp-giorno="'+d.k+'" aria-pressed="'+(d.k===k)+'">'+esc(giornoCorto(d))+'</button>'; }).join('')+'</div></div>':'');
    if(scadute.length) h+='<section class="spesa-gruppo prep-scadute"><h3>Scadute: da buttare</h3>'+scadute.map(function(p){ var r=ric(p.ric); return '<div class="riga-prep scaduta"><span><b>'+esc(r.nome)+'</b><small>'+qPronta(r,p.q)+' · del '+dataCorta(p.fatto)+' · '+quandoEntro(p.entro)+'</small></span><span class="azioni-riga"><button class="btn quieto piccolo" data-buttata="'+p.id+'">Buttata</button></span></div>'; }).join('')+'</section>';
    if(!conPiatti.length) h+='<p>Nella settimana non c’è ancora nessun piatto: prima prepara il menu.</p>';
