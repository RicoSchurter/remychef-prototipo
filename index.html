<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RemyChef · prototipo</title>
<style>
/* =====================================================================
   TABELLA DEI VALORI — copia di 04-STILE.md (bozza 2+, stile «Libro»).
   Ogni misura e ogni colore del prototipo vengono da qui.
   ===================================================================== */
:root{
  /* colori */
  --colore-marca:#7F390C; --colore-marca-chiaro:#F8C889; --colore-sfondo:#FBF6EE; --colore-superficie:#FFFFFF;
  --colore-testo:#2B1D14; --colore-testo-secondario:#5C4A3D; --colore-bordo:#8A7B6F; --colore-linea:#E8DDCF;
  --colore-chip:#F3E3CB; --colore-errore:#B42318; --colore-ok:#1E6B3A;
  --cucina-sfondo:#1C1714; --cucina-superficie:#2A221D; --cucina-testo:#F6EFE6; --cucina-testo-2:#CDBFAF; --cucina-accento:#F8C889;
  /* testo */
  --testo-corpo:15px; --testo-piccolo:13px; --titolo-3:18px; --titolo-2:22px; --titolo-1:26px; --titolo-gigante:34px;
  /* schermi fino a 1100 px (telefono, tablet): testo e bersagli più grandi; la pagina del cliente ha la sua scala */
  --tocco-testo-corpo:16px; --tocco-testo-piccolo:14px; --tocco-titolo-3:19px; --tocco-titolo-2:24px; --tocco-titolo-1:28px; --tocco-titolo-gigante:32px; --tocco-bersaglio:48px;
  --cliente-testo-corpo:17px; --cliente-testo-piccolo:15px; --cliente-titolo-3:20px; --cliente-titolo-1:28px;
  --interlinea:1.5; --riga-max:70ch;
  --carattere-app:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --carattere-libro:Georgia,"Noto Serif","Times New Roman",serif;
  /* spazi e forme */
  --spazio-1:4px; --spazio-2:8px; --spazio-3:16px; --spazio-4:24px; --spazio-5:32px; --spazio-6:48px; --spazio-7:64px;
  --raggio:8px; --raggio-scheda:12px; --bersaglio:40px; --cucina-bersaglio:64px;
  --ombra:0 1px 2px rgba(43,29,20,0.08);
  /* valori aggiunti con il pezzo 1 (vedi 04-STILE, «Valori del prototipo, pezzo 1») */
  --colore-su-marca:#FFFFFF; --colore-fuoco:#1F6FEB; --colore-errore-chiaro:#FDF0EE; --colore-domanda:#FFF7EA;
  --cucina-linea:#3A302A; --cucina-bordo:#9A8C7E; --cucina-passaggio:30px;
  --velo:rgba(28,23,20,0.45); --piega:rgba(43,29,20,0.05);
  --ombra-alta:0 8px 24px rgba(43,29,20,0.18); --ombra-piatto:0 4px 8px rgba(43,29,20,0.18);
  --piatto-cibo:#C9772E; --piatto-cibo-2:#E7B66E; --piatto-erba:#6E8B3D; --piatto-orlo:#EFE8DF;
  --interlinea-titoli:1.15; --interlinea-righe:1.3;
  --bordo-fine:1px; --bordo:2px; --fuoco:3px; --tondo:999px;
  --larghezza-lato:220px; --larghezza-lato-stretta:104px; --larghezza-elenco:380px; --larghezza-elenco-media:320px;
  --larghezza-pagina:1080px; --larghezza-finestra:640px; --larghezza-avviso:560px; --larghezza-menu:240px; --larghezza-modulo:760px; --stile-min:200px; --larghezza-entrata:1040px; --passo-cerchio:32px;
  --piatto-grande:168px; --piatto-medio:120px; --piatto-piccolo:88px; --piatto-riga:52px;
  --marchio:36px; --icona:22px; --icona-piccola:20px; --barra-sotto:64px;
  --interruttore-l:52px; --interruttore-a:30px; --interruttore-pomello:24px; --casella:28px; --punto:10px;
  --etichetta-riga:120px; --riga-frase:52ch; --riga-passo:34ch; --campo-min:140px; --colonna-quantita:96px; --colonna-unita:128px;
  --testo-area:96px; --testo-area-grande:320px; --giorno-min:150px; --giorno-tab:80px; --foglio-minimo:9pt; --foglio-qr:30mm;--foglio-qr-testo:46mm; --foglio-qr-tavolo:24mm; --qr-locale:160px; --qr-cartoncino:50mm; --cartoncino-l:105mm; --cartoncino-a:148.5mm; --etichetta-l:70mm; --etichetta-a:37mm; --foglio-etichetta-stretta:8pt; --foglio-logo:16mm; --foglio-logo-largo:50mm; --larghezza-stampa:1040px; --formato-min:120px; --anteprima-altezza:60vh; --qr-scuro:#000000; --qr-chiaro:#FFFFFF;
  --lavagna-sfondo:#24312C; --lavagna-testo:#F4F1E8; --lavagna-testo-2:#C9C3B4; --lavagna-accento:#F2C46D; --lavagna-linea:#5A6660;
  --minimal-sfondo:#FFFFFF; --minimal-testo:#111111; --minimal-testo-2:#555555; --minimal-linea:#D6D6D6;
  --classico-sfondo:#FFFDF7; --classico-testo:#1F1B16; --classico-testo-2:#5B5249; --classico-accento:#6E1F2F; --classico-linea:#E6DCCB;
  --trattoria-sfondo:#FFF6E5; --trattoria-testo:#2E1A0F; --trattoria-testo-2:#5E4636; --trattoria-accento:#A3271B; --trattoria-linea:#E9D3B0;
  --moderno-sfondo:#F5F7F6; --moderno-testo:#14201E; --moderno-testo-2:#4A5856; --moderno-accento:#0E5A52; --moderno-linea:#D5DEDB; --giorno-altezza:72px;
  --cucina-colonna-min:260px; --cucina-colonna-max:340px; --cucina-riga:56px; --cucina-bottone-min:140px;
  --foglio-testo:11pt; --foglio-titolo:24pt; --foglio-piatto:12pt; --foglio-sezione:13pt; --foglio-nota:10pt; --foglio-copertina:40pt; --foglio-sottotitolo:14pt;
  --foglio-copertina-altezza:250mm; --foglio-spazio-1:1mm; --foglio-spazio-2:2mm; --foglio-spazio-3:4mm; --foglio-spazio-4:8mm;
}

@media (max-width:1100px){:root{--testo-corpo:var(--tocco-testo-corpo);--testo-piccolo:var(--tocco-testo-piccolo);--titolo-3:var(--tocco-titolo-3);--titolo-2:var(--tocco-titolo-2);--titolo-1:var(--tocco-titolo-1);--titolo-gigante:var(--tocco-titolo-gigante);--bersaglio:var(--tocco-bersaglio)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--carattere-app);font-size:var(--testo-corpo);line-height:var(--interlinea);color:var(--colore-testo);background:var(--colore-sfondo)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible,label.btn:focus-within{outline:var(--fuoco) solid var(--colore-fuoco);outline-offset:var(--bordo)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.campo .sr{width:1px;min-height:0;padding:0;border:0} /* «.campo input» non deve allargare i campi nascosti */

/* ---------- componenti ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--spazio-2);min-height:var(--bersaglio);padding:0 var(--spazio-4);border-radius:var(--raggio);border:var(--bordo) solid var(--colore-marca);background:transparent;color:var(--colore-marca);font-weight:700;white-space:nowrap;text-decoration:none}
.btn.pieno{background:var(--colore-marca);color:var(--colore-su-marca)}
.btn.quieto{border-color:var(--colore-bordo);color:var(--colore-testo)}
.btn.piccolo{padding:0 var(--spazio-3)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:transparent;color:var(--colore-marca);font-weight:700;min-height:var(--bersaglio);padding:0 var(--spazio-2);text-decoration:underline;text-underline-offset:var(--fuoco)}
.chipf{min-height:var(--bersaglio);padding:0 var(--spazio-3);border-radius:var(--tondo);border:var(--bordo) solid var(--colore-bordo);background:transparent;font-weight:600}
.chipf[aria-pressed="true"]{background:var(--colore-testo);border-color:var(--colore-testo);color:var(--colore-sfondo)}
.etichetta{display:inline-flex;align-items:center;gap:var(--spazio-1);font-size:var(--testo-piccolo);font-weight:600;padding:calc(var(--spazio-1) / 2) var(--spazio-2);border-radius:var(--raggio);background:var(--colore-chip);margin:0 var(--spazio-1) var(--spazio-1) 0}
.auto{font-size:var(--testo-piccolo);font-weight:600;color:var(--colore-testo-secondario)}
.auto::before{content:"";display:inline-block;width:var(--spazio-2);height:var(--spazio-2);border-radius:50%;background:var(--colore-ok);margin-right:var(--spazio-2);vertical-align:middle}
.cerca{display:flex;align-items:center;gap:var(--spazio-2);min-height:var(--bersaglio);border:var(--bordo) solid var(--colore-bordo);border-radius:var(--raggio);padding:0 var(--spazio-3);background:var(--colore-superficie)}
.cerca input{border:0;background:transparent;width:100%;min-height:var(--bersaglio);outline:0}
.cerca:focus-within{outline:var(--fuoco) solid var(--colore-fuoco);outline-offset:var(--bordo)}
.campo{display:flex;flex-direction:column;gap:var(--spazio-1)}
.campo span{font-size:var(--testo-piccolo);font-weight:600;color:var(--colore-testo-secondario)}
.campo input,.campo select,.campo textarea,.inp{min-height:var(--bersaglio);border:var(--bordo) solid var(--colore-bordo);border-radius:var(--raggio);padding:var(--spazio-2) var(--spazio-3);background:var(--colore-superficie);width:100%}
.campo textarea,textarea.inp{min-height:var(--testo-area);resize:vertical}
.indietro.visibile{display:inline-flex;align-self:flex-start}
.stepper{display:inline-flex;align-items:center;border:var(--bordo) solid var(--colore-bordo);border-radius:var(--raggio);overflow:hidden;background:var(--colore-superficie)}
.stepper button{width:var(--bersaglio);height:var(--bersaglio);border:0;background:transparent;font-size:var(--titolo-3);font-weight:700}
.stepper output,.stepper .np{min-width:var(--bersaglio);width:var(--colonna-quantita);text-align:center;font-weight:700;border:0;background:transparent;min-height:var(--bersaglio)}
.interruttore{display:inline-flex;align-items:center;gap:var(--spazio-3);min-height:var(--bersaglio);cursor:pointer;font-weight:600}
.interruttore input{appearance:none;width:var(--interruttore-l);height:var(--interruttore-a);border-radius:var(--tondo);background:var(--colore-bordo);position:relative;transition:background .15s;flex:none;cursor:pointer}
.interruttore input::after{content:"";position:absolute;top:var(--fuoco);left:var(--fuoco);width:var(--interruttore-pomello);height:var(--interruttore-pomello);border-radius:50%;background:var(--colore-superficie);transition:left .15s}
.interruttore input:checked{background:var(--colore-testo)}
.interruttore input:checked::after{left:calc(var(--interruttore-l) - var(--interruttore-pomello) - var(--fuoco))}

body:has(.velo) .toast{bottom:auto;top:var(--spazio-4)}
.toast{position:fixed;left:var(--spazio-3);right:var(--spazio-3);bottom:var(--spazio-5);margin:0 auto;max-width:var(--larghezza-avviso);display:flex;align-items:center;gap:var(--spazio-3);justify-content:space-between;background:var(--colore-testo);color:var(--colore-sfondo);padding:var(--spazio-2) var(--spazio-2) var(--spazio-2) var(--spazio-4);border-radius:var(--raggio);font-weight:600;box-shadow:var(--ombra-alta);z-index:90;transform:translateY(var(--spazio-3));opacity:0;pointer-events:none;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s .2s} /* spento = non si raggiunge con il tasto Tab */
.toast.on{opacity:1;transform:translateY(0);visibility:visible;transition-delay:0s}
.toast.on .link{pointer-events:auto}
.toast .link{color:var(--colore-marca-chiaro)}

/* piatto disegnato (nessuna foto vera) */
.piatto{--cibo:var(--piatto-cibo);--cibo2:var(--piatto-cibo-2);aspect-ratio:1/1;border-radius:50%;flex:none;
  background:
   radial-gradient(circle at 40% 40%, var(--piatto-erba) 0 3%, transparent 3.5%),
   radial-gradient(circle at 60% 42%, var(--cibo2) 0 5%, transparent 5.5%),
   radial-gradient(circle at 44% 60%, var(--cibo2) 0 4%, transparent 4.5%),
   radial-gradient(circle at 58% 58%, var(--piatto-erba) 0 2.5%, transparent 3%),
   radial-gradient(circle at 50% 50%, var(--cibo) 0 25%, transparent 26%),
   radial-gradient(circle at 50% 50%, var(--colore-superficie) 0 46%, var(--piatto-orlo) 47% 50%, var(--colore-superficie) 51% 60%, transparent 61%);
  filter:drop-shadow(var(--ombra-piatto))}
.foto{aspect-ratio:1/1;border-radius:50%;object-fit:cover;flex:none;box-shadow:var(--ombra-piatto)}

/* ---------- entrata ---------- */
.entrata{min-height:100vh;display:grid;place-items:center;padding:var(--spazio-5) var(--spazio-3)}
.entrata .box{width:100%;max-width:var(--larghezza-avviso);display:flex;flex-direction:column;gap:var(--spazio-4)}
.marchio{display:flex;align-items:center;gap:var(--spazio-2);font-weight:800;font-size:var(--titolo-3);color:var(--colore-marca)}
.marchio i{width:var(--marchio);height:var(--marchio);display:grid;place-items:center;border-radius:var(--raggio);background:var(--colore-marca-chiaro);color:var(--colore-marca);font-family:var(--carattere-libro);font-style:normal;font-size:var(--titolo-3)}
.entrata h1{font-family:var(--carattere-libro);font-size:var(--titolo-gigante);line-height:var(--interlinea-titoli)}
.entrata p{color:var(--colore-testo-secondario)}
.ruoli{display:grid;gap:var(--spazio-2)}
.ruolo{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:var(--spazio-1);padding:var(--spazio-3) var(--spazio-4);border-radius:var(--raggio-scheda);border:var(--bordo) solid var(--colore-linea);background:var(--colore-superficie);box-shadow:var(--ombra)}
.ruolo:hover{border-color:var(--colore-marca)}
.ruolo b{font-size:var(--titolo-3)}
.ruolo span{font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
.entrata-griglia{width:100%;max-width:var(--larghezza-avviso);display:grid;gap:var(--spazio-6);align-items:center}
.entrata .come{display:flex;padding:var(--spazio-4)} /* versione 7: anche sul telefono */
@media (min-width:1101px){.entrata-griglia{max-width:var(--larghezza-entrata);grid-template-columns:1fr 1fr}.entrata .come{display:flex}.entrata-griglia .nota-proto{grid-column:1/-1}}
.come{flex-direction:column;gap:var(--spazio-4);background:var(--colore-superficie);border:var(--bordo-fine) solid var(--colore-linea);border-radius:var(--raggio-scheda);padding:var(--spazio-5)}
.come h2{font-family:var(--carattere-libro);font-size:var(--titolo-2);line-height:var(--interlinea-titoli)}
.come ol{list-style:none;display:flex;flex-direction:column;gap:var(--spazio-4)}
.come li{display:flex;gap:var(--spazio-3);align-items:flex-start}
.come li svg{width:var(--icona);height:var(--icona);flex:none;color:var(--colore-marca)}
.come li span{display:block;color:var(--colore-testo-secondario)}
.nota-proto{font-size:var(--testo-piccolo);color:var(--colore-testo-secondario);border-top:var(--bordo-fine) solid var(--colore-linea);padding-top:var(--spazio-3)}

/* ---------- accesso alla versione online (solo da internet; aperto come file non compare) ---------- */
.porta{min-height:100vh;display:grid;place-items:center;padding:var(--spazio-3)}
.porta-box{width:100%;max-width:var(--larghezza-avviso);display:flex;flex-direction:column;gap:var(--spazio-3);background:var(--colore-superficie);border:var(--bordo-fine) solid var(--colore-linea);border-radius:var(--raggio-scheda);padding:var(--spazio-5) var(--spazio-4)}
.porta-box h1{font-family:var(--carattere-libro);font-size:var(--titolo-2);line-height:var(--interlinea-titoli)}
.porta-box p{color:var(--colore-testo-secondario)}
.porta-box .porta-errore{color:var(--colore-errore);font-weight:600}

/* ---------- costo merce e lista della spesa ---------- */
.attenzione{color:var(--colore-marca);font-weight:700}
.riquadro .manca{font-weight:700}
.prezzi-lista,.spesa-porz{display:flex;flex-direction:column;gap:var(--spazio-1)}
.riga-prezzo,.riga-porz{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:var(--spazio-2) var(--spazio-3);padding:var(--spazio-1) 0;border-bottom:var(--bordo-fine) solid var(--colore-linea)}
.riga-porz{grid-template-columns:minmax(0,1fr) var(--colonna-quantita)}
.riga-prezzo .nome,.riga-porz>span{display:flex;flex-direction:column;min-width:0}
.riga-prezzo small,.riga-porz small{font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
.riga-prezzo .prezzo .inp{width:var(--colonna-quantita)}
.riga-prezzo .unita{font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
@media (max-width:760px){.riga-prezzo{grid-template-columns:auto minmax(0,1fr)}.riga-prezzo .nome{grid-column:1 / -1}}
.foglio .piede .costo-ora{flex:1 1 auto}
.spesa h3{font-size:var(--testo-corpo);font-weight:700;color:var(--colore-testo);margin-bottom:var(--spazio-1)}
.spesa-porz-det summary{min-height:var(--bersaglio);display:flex;align-items:center;cursor:pointer;font-weight:700;color:var(--colore-marca)}
.riga-porz.senza{opacity:.7}
.riga-porz .inp{width:100%;text-align:right;font-variant-numeric:tabular-nums}
.costo-ora{font-weight:700}
.spesa-ris{display:flex;flex-direction:column;gap:var(--spazio-3)}
.spesa-totale{display:flex;flex-wrap:wrap;gap:0 var(--spazio-2);align-items:baseline}
.spesa-totale span{font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
.spesa-totale b{font-size:var(--titolo-3)}
.spesa-gruppo{display:flex;flex-direction:column}

.riga-spesa{display:grid;grid-template-columns:minmax(0,1fr) auto var(--colonna-quantita);align-items:baseline;gap:var(--spazio-3);padding:var(--spazio-1) 0;border-bottom:var(--bordo-fine) dashed var(--colore-linea)}
.riga-spesa b{font-variant-numeric:tabular-nums;white-space:nowrap}
.riga-spesa>small{text-align:right;font-size:var(--testo-piccolo);color:var(--colore-testo-secondario);font-variant-numeric:tabular-nums}
.riga-spesa.base-pronta{grid-template-columns:auto minmax(0,1fr) auto;align-items:center;min-height:var(--bersaglio)}
.riga-spesa.base-pronta input{width:var(--casella);height:var(--casella)}
.riga-spesa.base-pronta small{display:block;font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
.base-pronta-testo span small{display:block;font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
.foglio .piede .azioni{display:flex;gap:var(--spazio-2)}
/* ---------- guscio dell'app ---------- */
.app{display:grid;grid-template-columns:var(--larghezza-lato) 1fr;min-height:100vh}
.lato{position:sticky;top:0;height:100vh;background:var(--colore-superficie);border-right:var(--bordo-fine) solid var(--colore-linea);padding:var(--spazio-4) var(--spazio-3);display:flex;flex-direction:column;gap:var(--spazio-1)}
.voce{display:flex;align-items:center;gap:var(--spazio-3);min-height:var(--bersaglio);padding:0 var(--spazio-3);border-radius:var(--raggio);font-weight:600;border:0;background:transparent;text-align:left;width:100%}
.voce svg{width:var(--icona);height:var(--icona);flex:none}
.voce[aria-current="page"]{background:var(--colore-marca);color:var(--colore-su-marca)}
.chi{margin-top:auto;padding-top:var(--spazio-4);border-top:var(--bordo-fine) solid var(--colore-linea);font-size:var(--testo-piccolo);color:var(--colore-testo-secondario);display:flex;flex-direction:column;gap:var(--spazio-1)}
.chi b{color:var(--colore-testo)}
.chi .link{align-self:flex-start;padding:0;font-size:var(--testo-piccolo)}
.sotto{display:none}
.lato .cambia-corto{display:none;margin-top:auto}
.testa-tel{display:none}
main{min-width:0}

/* ---------- ricettario ---------- */
.ricettario{display:grid;grid-template-columns:var(--larghezza-elenco) 1fr;min-height:100vh}
.elenco{border-right:var(--bordo-fine) solid var(--colore-linea);padding:var(--spazio-4) var(--spazio-3);display:flex;flex-direction:column;gap:var(--spazio-3);min-width:0}
.elenco h2{font-size:var(--titolo-1);line-height:var(--interlinea-titoli)}
.conta{color:var(--colore-testo-secondario);font-size:var(--testo-piccolo)}
.azioni-elenco{display:flex;gap:var(--spazio-2);flex-wrap:wrap}
.testa-elenco{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--spazio-2)}

.ordine-azioni small.fatto{color:var(--colore-ok);font-weight:700}
.riga-spesa .celho{font-size:var(--testo-piccolo);margin-left:var(--spazio-2)}
.voce-prezzo{display:flex;flex-direction:column;gap:var(--spazio-1);padding-bottom:var(--spazio-2);border-bottom:var(--bordo-fine) solid var(--colore-linea)}
.voce-prezzo .riga-prezzo{border-bottom:0}
.dettagli-prezzo{display:flex;flex-wrap:wrap;gap:var(--spazio-2) var(--spazio-4);align-items:center}
.dettagli-prezzo>label{display:flex;align-items:center;gap:var(--spazio-2);font-size:var(--testo-piccolo);color:var(--colore-testo-secondario)}
.dettagli-prezzo select.inp{width:auto;max-width:100%}
.riga-imp.fornitore{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr) auto}
@media (max-width:560px){.riga-imp.fornitore{grid-template-columns:minmax(0,1fr) auto}.riga-imp.fornitore>select{grid-column:1/2}}
/* ---------- versione 8: festivi, ferie, costo alto, prezzo fisso ---------- */
.giorno-tab .festivo{display:block;font-size:var(--testo-piccolo);color:var(--colore-marca);font-weight:600}
.riga-imp.ferie{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:end}
.comp-avviso{grid-column:1/-1}
.cli-riga-fissa.finito span{text-decoration:line-through}
/* ---------- versione 8: correzioni dopo le revisioni ---------- */
.servizio.serv-chiuso{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--spazio-2);color:var(--colore-testo-secondario)}
.giorno-piede{flex-wrap:wrap}
@media (max-width:560px){.riga-imp.ferie{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.riga-imp.ferie>button{grid-column:1/-1;grid-row:auto;justify-self:start}}
.riga-imp.pulizia{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr) minmax(0,1fr) auto}
.riga-imp.pulizia>input[data-pul-dose]{grid-column:1/3}.riga-imp.pulizia>input[data-pul-chi]{grid-column:3/5}
@media (max-width:560px){.riga-imp.pulizia>input[data-pul-dose],.riga-imp.pulizia>input[data-pul-chi]{grid-column:1/2}}
.segno{min-width:var(--bersaglio);font-weight:700}
.scegli-scongela{display:flex;flex-wrap:wrap;align-items:center;gap:var(--spazio-2);margin-top:var(--spazio-1);font-size:var(--testo-piccolo)}
.festivi-in-arrivo{margin:0}
@media print{.st-registro .st-firma{margin-top:var(--foglio-spazio-4);font-size:var(--foglio-testo)}.st-registro .st-chiusura{break-inside:avoid;page-break-inside:avoid}}
</style>

{id:'fondo',resa:'litri',nome:'Fondo bruno di vitello',portata:'Basi',stagione:'Tutto l’anno',porzioni:3,tempo:'30 min + 7 h',condivisa:true,raccolte:[],
frase:'La base di brasati e umidi: ossa ben tostate, fuoco basso, pazienza. Resa circa 3 litri.',
ingr:[I('Ossa di vitello',4,'kg',{prov:'Vitello: Svizzera'}),I('Carota',300,'g'),I('Cipolla',300,'g'),I('Sedano',150,'g'),I('Porro',150,'g'),I('Concentrato di pomodoro',60,'g'),I('Vino bianco',3,'dl'),I('Acqua',8,'l'),I('Alloro',3,'foglie'),I('Timo',4,'rametti'),I('Pepe nero',1,'cucchiaini'),I('Olio di semi di girasole',3,'cucchiai')],
passi:[
'Disporre le ossa in una teglia unta con l’olio e tostarle in forno a 220 gradi per 45 minuti, girandole a metà.',
'Aggiungere carota, cipolla, sedano e porro tagliati a mirepoix grossa e proseguire per 15 minuti, finché le verdure sono ben colorite.',
'Spalmare il concentrato sulle ossa e tostare per 5 minuti. Sgrassare la teglia e deglassare il fondo con il vino bianco, staccando i succhi con una spatola.',
'Trasferire tutto in una marmitta, coprire con l’acqua fredda e portare lentamente a bollore.',
'Schiumare, unire alloro, timo e pepe in grani e lasciar sobbollire senza coperchio per 6 ore, schiumando di tanto in tanto.',
'Filtrare allo chinois con l’étamine, raffreddare rapidamente in abbattitore e togliere il grasso in superficie. Si porziona e si congela, oppure va in frigo.'
]},

{id:'brodo',resa:'litri',nome:'Brodo vegetale',portata:'Basi',stagione:'Tutto l’anno',porzioni:4,tempo:'15 min + 1 h',condivisa:true,raccolte:[],
frase:'Brodo limpido per risotti e zuppe. Senza sale: si regola nel piatto finito. Resa circa 4 litri.',
ingr:[I('Carota',300,'g'),I('Cipolla',300,'g'),I('Sedano',200,'g'),I('Porro',200,'g'),I('Prezzemolo',20,'g'),I('Alloro',2,'foglie'),I('Pepe nero',1,'cucchiaini'),I('Acqua',5,'l')],
passi:[
'Lavare le verdure e tagliarle a pezzi regolari. La cipolla si lascia con la buccia esterna dorata per dare colore.',
'Metterle in una pentola con l’acqua fredda, il prezzemolo con i gambi, l’alloro e il pepe in grani.',
'Portare a bollore, abbassare la fiamma e lasciar sobbollire per 1 ora senza coperchio.',
'Filtrare al colino fine senza schiacciare le verdure, così il brodo resta limpido.',
'Raffreddare in abbattitore e conservare in frigo, etichettato con la data.'
]},

{id:'brodocarne',resa:'litri',nome:'Brodo di carne',portata:'Basi',stagione:'Tutto l’anno',porzioni:5,tempo:'20 min + 4 h',condivisa:true,raccolte:['Classici della casa'],
frase:'Biancostato, ossa e gallina: il brodo di casa per risotti, busecca e ossobuco. Resa circa 5 litri.',
ingr:[I('Biancostato di manzo',1.5,'kg',{prov:'Manzo: Svizzera'}),I('Ossa di manzo',1,'kg',{prov:'Manzo: Svizzera'}),I('Gallina',1.2,'kg',{prov:'Gallina: Svizzera'}),I('Cipolla',250,'g'),I('Chiodi di garofano',2,'pz'),I('Carota',250,'g'),I('Sedano',150,'g'),I('Porro',150,'g'),I('Alloro',2,'foglie'),I('Pepe nero',1,'cucchiaini'),I('Acqua',7,'l'),I('Sale',20,'g')],
passi:[
'Sbollentare le ossa per 5 minuti, scolarle e sciacquarle: il brodo verrà più pulito.',
'Mettere ossa, biancostato e gallina in una marmitta con l’acqua fredda e portare piano a bollore, schiumando con cura.',
'Aggiungere la cipolla steccata con i chiodi di garofano, carota, sedano, porro, alloro e pepe in grani.',
'Lasciar sobbollire a fuoco minimo per 3 ore e 30 minuti, senza mai far bollire forte. Salare a fine cottura.',
'Togliere le carni (il biancostato si recupera per il bollito o per un ripieno) e filtrare il brodo con l’étamine.',
'Raffreddare in abbattitore, sgrassare e conservare in frigo con l’etichetta.'
]},

// ===== ANTIPASTI =====
{id:'vitellotonnato',nome:'Vitello tonnato',nomeDe:'Vitello tonnato (Kalbfleisch mit Thunfischsauce)',portata:'Antipasti',stagione:'Estate',porzioni:8,tempo:'30 min + 1 h 30 min',condivisa:true,raccolte:['Classici della casa'],
frase:'Girello cotto rosa nel brodo, affettato sottile, salsa tonnata montata con i tuorli sodi.',
ingr:[I('Girello di vitello',1,'kg',{prov:'Vitello: Svizzera'}),I('Brodo vegetale',2,'l',{base:'brodo'}),I('Vino bianco',2,'dl'),I('Alloro',2,'foglie'),I('Tonno sott’olio',180,'g',{prov:'Tonno: Oceano Atlantico centro-orientale'}),I('Filetti di acciuga',20,'g',{prov:'Acciughe: Mar Mediterraneo'}),I('Capperi sotto sale',30,'g'),I('Uova',4,'pz'),I('Olio extravergine d’oliva',1.5,'dl'),I('Limone',1,'pz'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Legare il girello, portare a bollore brodo, vino e alloro e immergervi la carne. Cuocere a fuoco basso per 45 minuti, fino a 58 gradi al cuore.',
'Lasciar raffreddare la carne nel suo liquido per 30 minuti, poi sgocciolarla e tenere da parte 2 dl di liquido filtrato.',
'Rassodare le uova in acqua bollente per 9 minuti, raffreddarle in acqua e ghiaccio e tenere solo i tuorli.',
'Frullare tonno sgocciolato, acciughe, capperi dissalati e tuorli. Montare a filo con l’olio, allungando con il liquido di cottura fino a una salsa vellutata. Regolare con limone, sale e pepe.',
'Affettare il girello freddo all’affettatrice, 2 mm di spessore.',
'Impiattare le fette a raggiera, nappare con la salsa e finire con qualche cappero. Tenere in frigo coperto almeno per mezz’ora prima del servizio.'
]},

{id:'lavarello',nome:'Lavarello in carpione',nomeDe:'Felchen in Carpione (süss-sauer eingelegt)',portata:'Antipasti',stagione:'Estate',porzioni:6,tempo:'40 min (+ 24 h in carpione, il giorno prima)',condivisa:true,raccolte:['Dal lago'],
frase:'Filetti di lavarello fritti e lasciati un giorno nella marinata di aceto, cipolla e salvia.',
ingr:[I('Filetti di lavarello',700,'g',{prov:'Lavarello: Svizzera, lago'}),I('Farina di frumento',80,'g'),I('Olio di semi di girasole',1,'l'),I('Cipolla',300,'g'),I('Aceto di vino bianco',3,'dl'),I('Vino bianco',2,'dl'),I('Acqua',1,'dl'),I('Zucchero',15,'g'),I('Salvia',10,'foglie'),I('Alloro',3,'foglie'),I('Pepe nero',1,'cucchiaini'),I('Sale',null,'q.b.')],
passi:[
'Spinare i filetti, tagliarli a tranci di 6 cm, salarli e infarinarli scuotendo bene l’eccesso.',
'Friggerli in olio a 170 gradi per 3 minuti, finché sono dorati. Scolarli su carta e disporli in un contenitore basso, in un solo strato.',
'In una casseruola stufare la cipolla a fette sottili con 3 cucchiai dell’olio di frittura per 8 minuti, senza farle prendere colore.',
'Aggiungere aceto, vino, acqua, zucchero, salvia, alloro e pepe in grani. Portare a bollore e cuocere per 5 minuti.',
'Versare la marinata bollente sul pesce, in modo che lo copra del tutto. Lasciar intiepidire, coprire con pellicola a contatto.',
'Far riposare in frigo per 24 ore. Servire a temperatura ambiente con la cipolla della marinata sopra.'
]},

{id:'insalataformaggella',nome:'Insalata con formaggella, pere e noci',nomeDe:'Salat mit Formaggella, Birnen und Baumnüssen',portata:'Antipasti',stagione:'Autunno',porzioni:4,tempo:'20 min',condivisa:false,raccolte:['Menu d’autunno'],
frase:'Formaggella tiepida, pere crude, noci tostate e vinaigrette al miele. Il mio antipasto di ottobre.',
ingr:[I('Formaggella',240,'g'),I('Misticanza',200,'g'),I('Pere',2,'pz'),I('Noci',60,'g'),I('Miele',2,'cucchiai'),I('Senape',1,'cucchiaini'),I('Aceto di vino bianco',2,'cucchiai'),I('Olio extravergine d’oliva',6,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Tostare i gherigli di noce in forno a 160 gradi per 8 minuti e spezzettarli grossolanamente.',
'Emulsionare miele, senape, aceto, sale e pepe; aggiungere l’olio a filo frustando.',
'Tagliare la formaggella in 8 spicchi e scaldarla in forno a 180 gradi per 4 minuti, solo finché la pasta si ammorbidisce.',
'Tagliare le pere a spicchi sottili al momento, senza sbucciarle, così non anneriscono.',
'Condire la misticanza con metà vinaigrette, disporla nel piatto, aggiungere pere e formaggella tiepida.',
'Finire con le noci e un filo della vinaigrette rimasta. Servire subito.'
]},

{id:'busecca',nome:'Busecca',nomeDe:'Busecca (Tessiner Kuttelsuppe)',portata:'Zuppe',stagione:'Inverno',porzioni:6,tempo:'40 min + 4 h (+ ammollo dei fagioli 12 h, il giorno prima)',condivisa:true,raccolte:['Classici della casa'],
frase:'La zuppa di trippa delle nostre valli: borlotti, verdure, brodo di carne e una nevicata di formaggio.',
ingr:[I('Trippa di manzo',1,'kg',{prov:'Manzo: Svizzera'}),I('Fagioli borlotti secchi',150,'g'),I('Brodo di carne',2,'l',{base:'brodocarne'}),I('Lardo',80,'g',{prov:'Maiale: Svizzera'}),I('Burro',30,'g'),I('Cipolla',150,'g'),I('Carota',150,'g'),I('Sedano',100,'g'),I('Porro',150,'g'),I('Cavolo verza',250,'g'),I('Patate',300,'g'),I('Pomodori pelati',300,'g'),I('Salvia',4,'foglie'),I('Parmigiano Reggiano',80,'g'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Il giorno prima mettere i borlotti in ammollo in acqua fredda per 12 ore.',
'Lavare bene la trippa, sbollentarla per 10 minuti, scolarla e tagliarla a listarelle di 1 cm.',
'In una casseruola alta far fondere il lardo battuto con il burro e la salvia, poi stufare cipolla, carota, sedano e porro tagliati a cubetti per 10 minuti.',
'Unire la trippa, insaporire per 5 minuti, aggiungere i pomodori schiacciati, i borlotti scolati e il brodo caldo. Coprire e cuocere a fuoco basso per 2 ore e 30 minuti.',
'Aggiungere patate a cubetti e verza a striscioline e proseguire per 40 minuti, finché trippa e fagioli sono teneri. Regolare di sale e pepe.',
'Servire ben calda con il formaggio grattugiato a parte.'
]},

{id:'minestrone',nome:'Minestrone di verdure',nomeDe:'Minestrone (Gemüsesuppe)',portata:'Zuppe',stagione:'Tutto l’anno',porzioni:8,tempo:'30 min + 1 h 30 min (+ ammollo dei fagioli 12 h, il giorno prima)',condivisa:true,raccolte:['Classici della casa'],
frase:'Minestrone da osteria: verdure secondo il mercato, borlotti, ditalini e un battuto di lardo.',
ingr:[I('Fagioli borlotti secchi',150,'g'),I('Brodo vegetale',2.5,'l',{base:'brodo'}),I('Lardo',60,'g',{prov:'Maiale: Svizzera'}),I('Cipolla',150,'g'),I('Carota',200,'g'),I('Sedano',150,'g'),I('Porro',150,'g'),I('Patate',300,'g'),I('Zucchine',300,'g'),I('Cavolo verza',250,'g'),I('Pomodori pelati',300,'g'),I('Ditalini',150,'g'),I('Parmigiano Reggiano',80,'g'),I('Olio extravergine d’oliva',3,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Mettere i borlotti in ammollo in acqua fredda per 12 ore, poi scolarli.',
'In una casseruola capiente rosolare il lardo battuto con l’olio, aggiungere cipolla, carota, sedano e porro a dadini e stufare per 10 minuti.',
'Unire borlotti, pomodori schiacciati e brodo. Cuocere a fuoco basso per 1 ora.',
'Aggiungere patate, zucchine e verza tagliate a cubetti regolari e proseguire per 20 minuti.',
'Buttare i ditalini direttamente nel minestrone e cuocere per 10 minuti, mescolando dal fondo. Regolare di sale e pepe.',
'Servire con un filo d’olio a crudo e il formaggio grattugiato a parte. Il giorno dopo è ancora più buono.'
]},

{id:'zuppacastagne',nome:'Zuppa di castagne',nomeDe:'Kastaniensuppe',portata:'Zuppe',stagione:'Autunno',porzioni:6,tempo:'30 min + 1 h 15 min (+ ammollo delle castagne 12 h, il giorno prima)',condivisa:true,raccolte:['Menu d’autunno'],
frase:'Castagne secche, porro e patate, frullate a metà. Crostini al burro e rosmarino sopra.',
ingr:[I('Castagne secche',300,'g'),I('Brodo vegetale',1.5,'l',{base:'brodo'}),I('Porro',150,'g'),I('Patate',200,'g'),I('Sedano',80,'g'),I('Burro',60,'g'),I('Alloro',1,'foglie'),I('Rosmarino',2,'rametti'),I('Panna',1,'dl'),I('Pane raffermo',120,'g'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Mettere le castagne in ammollo in acqua fredda per 12 ore. Scolarle ed eliminare i residui di pellicina.',
'In una casseruola stufare porro e sedano a rondelle con 30 g di burro per 8 minuti.',
'Aggiungere castagne, patate a cubetti, alloro e brodo caldo. Cuocere a fuoco basso con coperchio per 1 ora, finché le castagne si schiacciano tra le dita.',
'Togliere l’alloro, frullare metà della zuppa e riunirla al resto: deve restare qualche pezzo intero. Unire la panna e regolare di sale e pepe.',
'Tagliare il pane a dadini e tostarlo in padella con il burro rimasto e il rosmarino per 5 minuti.',
'Servire la zuppa ben calda con i crostini sopra e una macinata di pepe.'
]},

// ===== PRIMI =====
{id:'risotto',nome:'Risotto al Merlot con luganighetta',nomeDe:'Merlot-Risotto mit Luganighetta (Tessiner Wurst)',portata:'Primi',stagione:'Autunno',porzioni:4,tempo:'35 min',condivisa:true,raccolte:['Classici della casa','Menu d’autunno'],
frase:'Il risotto della casa: Merlot del Ticino, luganighetta sbriciolata e una mantecatura generosa.',
ingr:[I('Riso Carnaroli',320,'g'),I('Luganighetta',300,'g',{prov:'Maiale: Svizzera'}),I('Merlot del Ticino',2,'dl'),I('Brodo di carne',1.2,'l',{base:'brodocarne'}),I('Scalogno',60,'g'),I('Burro',70,'g'),I('Parmigiano Reggiano',60,'g'),I('Olio extravergine d’oliva',2,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Togliere il budello alla luganighetta, sbriciolarla e rosolarla in padella con l’olio per 5 minuti. Tenerla da parte con il suo grasso.',
'In una casseruola stufare lo scalogno tritato fine con 20 g di burro, senza colorirlo.',
'Aggiungere il riso e tostarlo a fuoco vivo per 3 minuti, mescolando, finché i chicchi sono traslucidi e caldi.',
'Sfumare con metà del Merlot e lasciarlo evaporare. Unire la luganighetta e iniziare a bagnare con il brodo bollente, un mestolo alla volta.',
'Cuocere per 16 minuti, aggiungendo il Merlot rimasto a metà cottura. Il riso deve restare al dente e all’onda.',
'Fuori dal fuoco mantecare con il burro freddo a cubetti e il formaggio grattugiato. Coprire per 1 minuto e servire subito.'
]},

{id:'risottoporcini',nome:'Risotto ai funghi porcini',nomeDe:'Steinpilzrisotto',portata:'Primi',stagione:'Autunno',porzioni:4,tempo:'40 min',condivisa:true,raccolte:['Menu d’autunno'],
frase:'Porcini freschi trifolati a parte e uniti a metà cottura, così restano sodi e profumati.',
ingr:[I('Riso Carnaroli',320,'g'),I('Funghi porcini',400,'g'),I('Brodo vegetale',1.2,'l',{base:'brodo'}),I('Scalogno',60,'g'),I('Aglio',1,'spicchi'),I('Vino bianco',1,'dl'),I('Burro',70,'g'),I('Parmigiano Reggiano',60,'g'),I('Prezzemolo',10,'g'),I('Olio extravergine d’oliva',3,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Pulire i porcini con un panno umido e un coltellino, senza lavarli. Tagliare i gambi a cubetti e le cappelle a fette.',
'Saltare i funghi in padella ben calda con l’olio e lo spicchio d’aglio schiacciato per 4 minuti. Salare, togliere l’aglio e tenere da parte.',
'Stufare lo scalogno tritato con 20 g di burro, aggiungere il riso e tostarlo per 3 minuti.',
'Sfumare con il vino bianco e, quando è evaporato, bagnare con il brodo bollente un mestolo alla volta.',
'Unire i porcini a metà cottura e proseguire per 9 minuti.',
'Fuori dal fuoco mantecare con il burro freddo e il formaggio, finire con il prezzemolo tritato e una macinata di pepe.'
]},

{id:'gnocchi',nome:'Gnocchi di patate al burro e salvia',nomeDe:'Kartoffelgnocchi mit Salbeibutter',portata:'Primi',stagione:'Tutto l’anno',porzioni:4,tempo:'1 h 20 min',condivisa:true,raccolte:[],
frase:'Patate farinose cotte con la buccia e passate calde: poca farina, gnocchi leggeri.',
ingr:[I('Patate',1,'kg'),I('Farina di frumento',250,'g'),I('Uova',1,'pz'),I('Noce moscata',null,'q.b.'),I('Sale',null,'q.b.'),I('Burro',100,'g'),I('Salvia',12,'foglie'),I('Parmigiano Reggiano',80,'g')],
passi:[
'Lessare le patate con la buccia, partendo da acqua fredda salata, per 40 minuti, finché la lama entra senza resistenza.',
'Sbucciarle ancora calde e passarle allo schiacciapatate direttamente sulla spianatoia. Lasciarle intiepidire per 10 minuti.',
'Unire uovo, sale, noce moscata e quasi tutta la farina. Impastare il minimo indispensabile, solo finché l’impasto è liscio e non appiccica.',
'Formare dei cordoni di 2 cm di diametro, tagliarli a tocchetti di 2 cm e passarli sui rebbi di una forchetta. Disporli su un vassoio infarinato.',
'Cuocere in abbondante acqua salata e scolarli con la schiumarola 1 minuto dopo che sono venuti a galla.',
'Saltarli nel burro spumeggiante con la salvia e servire con il formaggio grattugiato.'
]},

{id:'pizzoccheri',nome:'Pizzoccheri con verza e patate',nomeDe:'Pizzoccheri mit Wirz und Kartoffeln',portata:'Primi',stagione:'Inverno',porzioni:4,tempo:'1 h',condivisa:true,raccolte:[],
frase:'Pasta di grano saraceno tirata in casa, verza, patate, formaggio e burro all’aglio.',
ingr:[I('Farina di grano saraceno',400,'g'),I('Farina di frumento',100,'g'),I('Acqua',3,'dl'),I('Patate',250,'g'),I('Cavolo verza',200,'g'),I('Formaggio Valtellina Casera',250,'g'),I('Parmigiano Reggiano',150,'g'),I('Burro',150,'g'),I('Aglio',1,'spicchi'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Impastare le due farine con l’acqua per 5 minuti, fino a un impasto sodo e compatto.',
'Stendere la sfoglia a 3 mm, tagliarla in strisce di 7 cm e poi in tagliatelle larghe 5 mm.',
'In abbondante acqua salata cuocere la verza a striscioline e le patate a cubetti per 5 minuti.',
'Aggiungere i pizzoccheri e proseguire per 10 minuti.',
'Nel frattempo far imbiondire l’aglio nel burro per 2 minuti, poi toglierlo.',
'Scolare a strati in una pirofila calda: pizzoccheri e verdure, formaggio a scaglie e grattugiato, burro all’aglio. Finire con il pepe e servire subito.'
]},

{id:'pappardellecervo',nome:'Pappardelle al ragù di cervo',nomeDe:'Pappardelle mit Hirschragout',portata:'Primi',stagione:'Autunno',porzioni:6,tempo:'1 h + 3 h',condivisa:true,raccolte:['Menu d’autunno'],
frase:'Per la stagione della caccia: spalla di cervo al coltello, Merlot e ginepro, pappardelle all’uovo.',
ingr:[I('Spalla di cervo',700,'g',{prov:'Cervo: Svizzera'}),I('Cipolla',120,'g'),I('Carota',100,'g'),I('Sedano',80,'g'),I('Merlot del Ticino',3,'dl'),I('Fondo bruno di vitello',3,'dl',{base:'fondo'}),I('Concentrato di pomodoro',30,'g'),I('Bacche di ginepro',6,'pz'),I('Alloro',2,'foglie'),I('Burro',40,'g'),I('Olio extravergine d’oliva',3,'cucchiai'),I('Farina di frumento',500,'g'),I('Uova',5,'pz'),I('Parmigiano Reggiano',60,'g'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Mondare la spalla dai nervi e tagliarla al coltello a cubetti di mezzo centimetro.',
'Rosolare la carne in olio ben caldo, a più riprese, finché è colorita. Togliere e nella stessa casseruola stufare il battuto di cipolla, carota e sedano per 8 minuti.',
'Rimettere la carne, unire il concentrato, sfumare con il Merlot e lasciar ridurre a metà.',
'Aggiungere fondo bruno, ginepro schiacciato e alloro. Coprire e cuocere a fuoco minimo per 3 ore, mescolando ogni tanto. Regolare di sale e pepe.',
'Impastare farina e uova per 10 minuti, far riposare coperto per mezz’ora, stendere a 1 mm e tagliare le pappardelle larghe 2 cm.',
'Cuocere la pasta in acqua salata per 3 minuti, saltarla nel ragù con il burro e servire con il formaggio grattugiato.'
]},

// ===== SECONDI =====
{id:'brasato',nome:'Brasato al Merlot',nomeDe:'Rindsschmorbraten an Merlotsauce',portata:'Secondi',stagione:'Inverno',porzioni:6,tempo:'40 min + 3 h (+ marinatura 12 h, il giorno prima)',condivisa:true,raccolte:['Classici della casa'],
frase:'Cappello del prete marinato una notte nel Merlot del Ticino e brasato piano in forno.',
ingr:[I('Cappello del prete di manzo',1.5,'kg',{prov:'Manzo: Svizzera'}),I('Merlot del Ticino',7.5,'dl'),I('Fondo bruno di vitello',5,'dl',{base:'fondo'}),I('Cipolla',200,'g'),I('Carota',150,'g'),I('Sedano',100,'g'),I('Aglio',2,'spicchi'),I('Alloro',2,'foglie'),I('Rosmarino',1,'rametti'),I('Chiodi di garofano',3,'pz'),I('Farina di frumento',30,'g'),I('Burro',40,'g'),I('Olio extravergine d’oliva',3,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Mettere la carne in un contenitore con il Merlot, le verdure a pezzi, aglio, alloro, rosmarino e chiodi di garofano. Coprire e marinare in frigo per 12 ore.',
'Sgocciolare e asciugare la carne, salarla, infarinarla leggermente e rosolarla in una brasiera con olio e burro su tutti i lati, per 10 minuti.',
'Aggiungere le verdure scolate e farle colorire per 5 minuti. Bagnare con il vino della marinata e lasciar ridurre di un terzo.',
'Unire il fondo bruno, coprire e brasare in forno a 160 gradi per 3 ore, girando la carne ogni ora.',
'Togliere la carne e tenerla al caldo coperta. Frullare e passare il fondo di cottura, poi ridurlo sul fuoco fino a velare il cucchiaio. Regolare di sale e pepe.',
'Tagliare il brasato a fette di 1 cm, nappare con la salsa e servire con la polenta di mais rosso.'
]},

{id:'persico',nome:'Filetti di pesce persico dorati al burro e salvia',nomeDe:'Eglifilets in Salbeibutter',portata:'Secondi',stagione:'Estate',porzioni:4,tempo:'25 min',condivisa:true,raccolte:['Dal lago'],
frase:'Filetti passati in farina e uovo, dorati nel burro chiarificato. Si cuociono al momento, mai prima.',
ingr:[I('Filetti di pesce persico',600,'g',{prov:'Pesce persico: Svizzera, lago'}),I('Farina di frumento',80,'g'),I('Uova',2,'pz'),I('Burro',120,'g'),I('Salvia',12,'foglie'),I('Limone',1,'pz'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Controllare i filetti con le dita ed eliminare eventuali lische. Asciugarli bene con carta.',
'Chiarificare 80 g di burro a fuoco dolce per 10 minuti e filtrarlo.',
'Battere le uova con un pizzico di sale. Passare i filetti nella farina, scuoterli e poi nell’uovo.',
'Dorarli nel burro chiarificato ben caldo per 2 minuti per lato. Scolarli su carta e salarli.',
'Nella padella pulita far spumeggiare il burro rimasto con la salvia fino al color nocciola.',
'Impiattare i filetti, versare sopra il burro alla salvia e servire con uno spicchio di limone.'
]},

{id:'coniglio',nome:'Coniglio in umido con olive',nomeDe:'Kaninchenragout mit Oliven',portata:'Secondi',stagione:'Autunno',porzioni:4,tempo:'30 min + 1 h 15 min',condivisa:true,raccolte:['Menu d’autunno'],
frase:'Coniglio a pezzi rosolato, vino bianco, pomodoro e olive. Va con la polenta, sempre.',
ingr:[I('Coniglio',1.4,'kg',{prov:'Coniglio: Svizzera'}),I('Vino bianco',2,'dl'),I('Fondo bruno di vitello',2,'dl',{base:'fondo'}),I('Pomodori pelati',300,'g'),I('Olive nere',80,'g'),I('Cipolla',150,'g'),I('Aglio',2,'spicchi'),I('Rosmarino',2,'rametti'),I('Alloro',2,'foglie'),I('Farina di frumento',30,'g'),I('Olio extravergine d’oliva',4,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Tagliare il coniglio in 12 pezzi, salarlo, peparlo e infarinarlo leggermente.',
'Rosolarlo in una casseruola larga con l’olio, a più riprese, per 8 minuti, finché è dorato su tutti i lati. Toglierlo.',
'Nello stesso fondo stufare la cipolla a fette con aglio, rosmarino e alloro per 5 minuti.',
'Rimettere il coniglio, sfumare con il vino bianco e lasciarlo evaporare.',
'Aggiungere pomodori schiacciati e fondo bruno, coprire e cuocere a fuoco basso per 1 ora, girando i pezzi ogni tanto.',
'Unire le olive negli ultimi 10 minuti, regolare di sale e servire con la polenta di mais rosso.'
]},

{id:'ossobuco',nome:'Ossobuco in gremolada',nomeDe:'Ossobuco mit Gremolata',portata:'Secondi',stagione:'Inverno',porzioni:4,tempo:'30 min + 1 h 45 min',condivisa:true,raccolte:['Classici della casa'],
frase:'Ossobuco di vitello in bianco, cotto piano nel brodo e finito con la gremolada al limone.',
ingr:[I('Ossibuchi di vitello',1.4,'kg',{prov:'Vitello: Svizzera'}),I('Farina di frumento',40,'g'),I('Burro',60,'g'),I('Cipolla',150,'g'),I('Carota',80,'g'),I('Sedano',60,'g'),I('Vino bianco',1.5,'dl'),I('Brodo di carne',5,'dl',{base:'brodocarne'}),I('Limone',1,'pz'),I('Aglio',1,'spicchi'),I('Prezzemolo',20,'g'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Incidere la pellicina attorno agli ossibuchi in 3 o 4 punti, così non si arricciano in cottura. Salarli e infarinarli.',
'Rosolarli nel burro in una casseruola larga, in un solo strato, per 4 minuti per lato. Toglierli.',
'Stufare cipolla, carota e sedano tritati fini nello stesso fondo per 8 minuti.',
'Rimettere gli ossibuchi, sfumare con il vino bianco e lasciarlo evaporare. Bagnare con il brodo caldo fino a metà altezza.',
'Coprire e cuocere a fuoco minimo per 1 ora e 30 minuti, aggiungendo brodo se serve. La carne deve staccarsi dall’osso senza sfaldarsi.',
'Tritare insieme scorza di limone, aglio e prezzemolo. Spolverare la gremolada sugli ossibuchi 1 minuto prima di servire, con il loro fondo ristretto.'
]},

{id:'capretto',nome:'Capretto al forno con patate',nomeDe:'Gitzi aus dem Ofen mit Kartoffeln',portata:'Secondi',stagione:'Primavera',porzioni:6,tempo:'30 min + 2 h',condivisa:true,raccolte:[],
frase:'Il piatto della Pasqua: capretto nostrano a pezzi, rosmarino, aglio e patate cotte nel suo fondo.',
ingr:[I('Capretto',2,'kg',{prov:'Capretto: Svizzera'}),I('Patate',1.2,'kg'),I('Vino bianco',2.5,'dl'),I('Aglio',4,'spicchi'),I('Rosmarino',3,'rametti'),I('Salvia',8,'foglie'),I('Burro',50,'g'),I('Olio extravergine d’oliva',6,'cucchiai'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Tagliare il capretto a pezzi di circa 120 g, togliere il grasso in eccesso e lasciarlo a temperatura ambiente per mezz’ora.',
'Disporre i pezzi in una teglia con olio, aglio in camicia, rosmarino e salvia. Salare, pepare e aggiungere fiocchetti di burro.',
'Cuocere in forno a 180 gradi per 30 minuti, poi bagnare con il vino bianco.',
'Aggiungere le patate tagliate a spicchi, girarle nel fondo di cottura e salarle.',
'Proseguire per 1 ora e 15 minuti, girando carne e patate ogni 20 minuti e bagnando con poca acqua se il fondo asciuga.',
'Alzare a 220 gradi per 10 minuti per rendere la pelle croccante. Servire subito con il fondo della teglia.'
]},

// ===== CONTORNI =====
{id:'polenta',nome:'Polenta di mais rosso',nomeDe:'Polenta aus rotem Mais',portata:'Contorni',stagione:'Tutto l’anno',porzioni:8,tempo:'10 min + 1 h 15 min',condivisa:true,raccolte:['Classici della casa','Menu d’autunno'],
frase:'Farina di mais rosso macinata a pietra, cotta a lungo nel paiolo. Per brasato, coniglio e formaggi.',
ingr:[I('Farina per polenta di mais rosso',500,'g'),I('Acqua',2.5,'l'),I('Sale',20,'g'),I('Burro',50,'g')],
passi:[
'Portare a bollore l’acqua salata in un paiolo di rame o in una casseruola dal fondo spesso.',
'Versare la farina a pioggia, mescolando con la frusta per evitare grumi.',
'Passare al bastone di legno, abbassare la fiamma al minimo e cuocere per 1 ora e 15 minuti, mescolando spesso dal fondo.',
'Se si addensa troppo, aggiungere poca acqua bollente. È pronta quando si stacca dalle pareti.',
'Fuori dal fuoco incorporare il burro e servire subito morbida, oppure versarla su un tagliere per tagliarla a fette.'
]},

{id:'verza',nome:'Verza stufata con pancetta',nomeDe:'Geschmorter Wirz mit Speck',portata:'Contorni',stagione:'Inverno',porzioni:6,tempo:'15 min + 40 min',condivisa:false,raccolte:[],
frase:'Verza stufata piano con pancetta e un goccio d’aceto. La preparo io, va con brasato e polenta.',
ingr:[I('Cavolo verza',1,'kg'),I('Pancetta',120,'g',{prov:'Maiale: Svizzera'}),I('Cipolla',120,'g'),I('Burro',30,'g'),I('Aceto di vino bianco',2,'cucchiai'),I('Acqua',1,'dl'),I('Sale',null,'q.b.'),I('Pepe nero',null,'q.b.')],
passi:[
'Togliere le foglie esterne e il torsolo della verza e tagliarla a striscioline di 1 cm. Lavarla e scolarla.',
'In una casseruola larga far rosolare la pancetta a listarelle nel burro per 5 minuti, poi aggiungere la cipolla a fette e stufarla per 5 minuti.',
'Unire la verza, salare e girarla finché si appassisce. Aggiungere l’acqua.',
'Coprire e stufare a fuoco basso per 30 minuti, mescolando ogni tanto.',
'Scoperchiare, sfumare con l’aceto e lasciar asciugare per 5 minuti. Regolare di sale e pepe.'
]},

// ===== DOLCI =====

function visibiliPerRuolo(){ return S.ricette.filter(function(r){return eChef()||r.condivisa;}); }
function filtriVuoti(){return {stagione:null,tempo:null,dieta:null,senza:[],raccolta:null,stato:null};}
/* minuti dal campo «Tempo» scritto a mano: «3 h 20 min», «35 min», «20 min + 4 h» */
function minuti(t){var m,tot=0,re=/(\d+(?:[.,]\d+)?)\s*(h|ore?|ora|min)/gi; t=String(t||'').replace(/\([^)]*\)/g,''); /* quello che si fa il giorno prima non conta */ while((m=re.exec(t))){var v=parseFloat(m[1].replace(',','.'));tot+=/^min/i.test(m[2])?v:v*60;} return tot;}
var TEMPI=[['breve','Fino a 30 min'],['medio','Fino a 1 ora'],['lungo','Più di 1 ora']];
var ORDINI=[['az','Dalla A alla Z'],['usate','Le più usate'],['recenti','Le ultime aggiunte']];
var STATI=[['private','Private'],['condivise','Condivise'],['completare','Da completare']];
var SINONIMI_SENZA={lattosio:'Latte',latticini:'Latte',formaggio:'Latte',uovo:'Uova',noci:'Frutta a guscio',nocciole:'Frutta a guscio',mandorle:'Frutta a guscio',frutta:'Frutta a guscio',glutine:'Glutine',frumento:'Glutine',pesce:'Pesce',crostacei:'Crostacei',molluschi:'Molluschi'};
/* le parole speciali della ricerca diventano filtri; il resto si cerca nel nome e negli ingredienti */
function capisciRicerca(q){ var out={senza:[],dieta:null,stagione:false};
  q=(' '+q+' ').replace(/\s+senza\s+([a-z]+(?:\s+a\s+guscio)?)/g,function(t,w){ var a=SINONIMI_SENZA[w]||ALLERGENI.filter(function(x){return piega(x)===w||piega(x).split(' ')[0]===w||piega(x)===w.replace(/i$/,'e');})[0]; if(!a) return t; if(out.senza.indexOf(a)<0) out.senza.push(a); return ' '; });
  q=q.replace(/\s(vegan[oaie]?)\s/g,function(){ out.dieta='vegan'; return ' '; }).replace(/\s(vegetarian[oaie])\s/g,function(){ if(!out.dieta) out.dieta='veg'; return ' '; });
  q=q.replace(/\s(di\s+)?stagione\s/g,function(){ out.stagione=true; return ' '; });
  out.q=q.trim().replace(/\s+/g,' '); return out; }
function passaFiltri(r,f,q){
  if(S.portata!=='Tutte'&&r.portata!==S.portata) return false;
  if(q){ var cr=capisciRicerca(q); q=cr.q; if(cr.senza.length||cr.dieta||cr.stagione){ var a0=analisi(r);
    if(cr.senza.length&&(a0.mancano.length||cr.senza.some(function(x){return a0.all.indexOf(x)>=0;}))) return false;
    if(cr.dieta){ var d0=S.conferme[r.id]===false?null:dieta(a0); if(!d0||(cr.dieta==='vegan'&&d0!=='Vegano')) return false; }
    if(cr.stagione&&r.stagione!==stagioneDi(new Date())&&r.stagione!=='Tutto l’anno') return false; } }
  if(q){ var testo=piega(r.nome)+' '+r.ingr.map(function(i){return piega(i.nome);}).join(' ');
    /* ogni parola cercata deve esserci; «risotti» trova «risotto», «luganiga» trova «luganighetta» */
    if(!q.split(/\s+/).every(function(w){return testo.indexOf(w)>=0||(w.length>3&&testo.indexOf(w.slice(0,-1))>=0);})) return false; }
  if(f.stagione&&r.stagione!==f.stagione&&r.stagione!=='Tutto l’anno') return false;
  if(f.tempo){var mi=minuti(r.tempo); if(!mi) return false; if(f.tempo==='breve'&&mi>30) return false; if(f.tempo==='medio'&&mi>60) return false; if(f.tempo==='lungo'&&mi<=60) return false;}
  var a=analisi(r);
  if(f.dieta){var d=S.conferme[r.id]===false?null:dieta(a); if(!d) return false; if(f.dieta==='vegan'&&d!=='Vegano') return false;}
  /* «senza»: una ricetta con dati mancanti non si può garantire, quindi resta fuori */
  if(f.senza.length&&(a.mancano.length||f.senza.some(function(x){return a.all.indexOf(x)>=0;}))) return false;
  if(f.raccolta&&(r.raccolte||[]).indexOf(f.raccolta)<0) return false;
  if(f.stato==='private'&&r.condivisa) return false;
  if(f.stato==='condivise'&&!r.condivisa) return false;
  if(f.stato==='completare'&&!a.mancano.length) return false;
  return true; }
function filtrate(){
  var q=piega(S.q), tutte=visibiliPerRuolo();
  var l=tutte.filter(function(r){return passaFiltri(r,S.f,q);});
  if(S.ordina==='az') l.sort(function(a,b){return String(a.nome).localeCompare(String(b.nome),'it');});
  else if(S.ordina==='usate') l.sort(function(a,b){return (b.usi||0)-(a.usi||0);});
  else if(S.ordina==='recenti') l.sort(function(a,b){return S.ricette.indexOf(a)-S.ricette.indexOf(b);}); /* le nuove entrano in testa */
  /* le basi stanno in fondo: lo chef cerca prima i piatti */
  /* versione 10: le ricette importate ancora da controllare stanno in testa */
  var testa=function(a){ return a.filter(function(r){return r.importata;}).concat(a.filter(function(r){return !r.importata;})); };
  return testa(l.filter(function(r){return r.portata!=='Basi';})).concat(testa(l.filter(function(r){return r.portata==='Basi';})));
}
function quantiFiltri(){var f=S.f;return (f.stagione?1:0)+(f.tempo?1:0)+(f.dieta?1:0)+f.senza.length+(f.raccolta?1:0)+(f.stato?1:0);}
/* le scelte attive, come etichette che si tolgono con un tocco */
function chipsAttivi(){var f=S.f,c=[];
  if(f.stagione) c.push(['stagione',f.stagione]);
  if(f.tempo) c.push(['tempo',TEMPI.filter(function(t){return t[0]===f.tempo;})[0][1]]);
  if(f.dieta) c.push(['dieta',f.dieta==='vegan'?'Vegane':'Vegetariane']);
  f.senza.forEach(function(x){c.push(['senza:'+x,'Senza '+x.toLowerCase()]);});
  if(f.raccolta) c.push(['raccolta',f.raccolta]);
  if(f.stato) c.push(['stato',STATI.filter(function(t){return t[0]===f.stato;})[0][1]]);
  return c;}
function togliChip(k){ if(k.indexOf('senza:')===0){var x=k.slice(6);S.f.senza=S.f.senza.filter(function(y){return y!==x;});} else S.f[k]=null; }
/* le ricette nel menu di oggi, visibili a chi guarda */
function ricetteDiOggi(){ var k=chiaveGiorno(new Date()), ids=[]; if(chiuso(k)) return ids; serviziDi(k).forEach(function(sv){ var m=menuDi(k,sv); if(m) m.piatti.forEach(function(p){ [p.ric,p.alt].forEach(function(id){ var r=id&&ric(id); if(r&&(eChef()||r.condivisa)&&ids.indexOf(id)<0) ids.push(id); }); }); }); return ids; }

  if(tutte.length&&oggiR.length) h+='<div class="oggi-menu"><small>Oggi nel menu</small><div class="filtri">'+oggiR.map(function(id){return '<button class="chipf" data-oggi-ric="'+id+'" aria-current="'+(id===S.sel)+'">'+esc(ric(id).nome)+'</button>';}).join('')+'</div></div>';
  if(tutte.length){
   h+='<div class="cerca">'+ICONE.cerca+'<input type="search" id="q" placeholder="Cerca ricetta o ingrediente" value="'+esc(S.q)+'" aria-label="Cerca una ricetta o un ingrediente">'+

  var p=m.piatti.splice(i,1)[0]; if(p.ric&&ric(p.ric)) ric(p.ric).usi=Math.max(0,(ric(p.ric).usi||1)-1); if(m.stato==='online') m.aggiornato=true;
  var rotte=m.fisso?m.fisso.comp.filter(function(c){return c.portate.indexOf(p.portata)>=0&&!m.piatti.some(function(x){return x.portata===p.portata;});}):[];

function ultimaVolta(id){ var best=null; Object.keys(S.storico).forEach(function(k){ var g=S.storico[k]; ['pranzo','cena'].forEach(function(s){ (g[s]||[]).forEach(function(x){ if(x.ric===id){var d=giorniFa(k); if(best===null||d<best) best=d;} }); }); }); return best; }

  return visibiliPerRuolo().filter(function(r){ if(r.portata==='Basi'||!r.portata) return false; if(!(r.stagione===st||r.stagione==='Tutto l’anno')) return false;

    if(giorni().some(function(d){return ['pranzo','cena'].some(function(sv){var mm=menuDi(d.k,sv);return mm&&mm.piatti.some(function(p){return p.ric===r.id||p.alt===r.id;});});})) return false;

function basePronta(r,k){ var b=r.ingr.filter(function(i){return i.base&&ric(i.base)&&disponibile(i.base,k)>0;})[0]; return b?ric(b.base):null; }
/* l'ultimo menu dello stesso servizio, prima di quel giorno: dai giorni della settimana o dallo storico */
function ultimoMenu(k,serv){ var cand=[];

/* i dati di un piatto da copiare: tutto tranne l'identità e lo stato del giorno (finito) */
function datiPiatto(p){ return {ric:p.ric,nome:p.nome||'',nomeDe:p.nomeDe||'',descr:p.descr||'',portata:p.portata,prezzo:p.prezzo,mezza:p.mezza!=null?p.mezza:null,alt:p.alt||null,man:p.man?clona(p.man):null,snap:p.snap?clona(p.snap):null}; }
/* copia: tutti i campi (RC-02); i piatti già presenti non si ripetono, anche quelli scritti a mano (RC-03);
   un piatto la cui ricetta non c'è più passa come piatto scritto a mano, con i dati che aveva (RC-04) */
function copiaMenu(k,serv,da){ var m=menuDi(k,serv,true), out={n:0,gia:[],aMano:[]};
  out.persi=0;
  da.piatti.forEach(function(x){ var r=x.ric&&ric(x.ric), nome=x.nome||(r?r.nome:(x.snap?x.snap.nome:''));
    if(r){ if(m.piatti.some(function(p){return p.ric===x.ric;})){ out.gia.push(nome); return; }
      m.piatti.push(nuovoPiatto({ric:x.ric,nome:x.nome||'',nomeDe:x.nomeDe||'',descr:x.descr||'',portata:x.portata||r.portata,prezzo:x.prezzo!=null?x.prezzo:(S.prezzi[x.ric]!=null?S.prezzi[x.ric]:null),mezza:x.mezza!=null?x.mezza:null,alt:x.alt&&ric(x.alt)?x.alt:null}));
      r.usi=(r.usi||0)+1; out.n++; return; }
    var man=x.man?clona(x.man):null, daRicetta=false;
    if(!man&&x.snap){ man={all:x.snap.all.slice(),nessuno:!x.snap.all.length,carne:x.snap.prov.length>0,prov:x.snap.prov.join('; '),veg:x.snap.dieta||false}; daRicetta=true; }
    if(!man){ out.persi++; return; } /* dallo storico, ricetta eliminata e nessun dato: non si inventa, lo si dice */
    if(m.piatti.some(function(p){return !p.ric&&chiave(p.nome)===chiave(nome)&&p.portata===x.portata;})){ out.gia.push(nome); return; }
    if(daRicetta) out.aMano.push(nome);
    m.piatti.push(nuovoPiatto({nome:nome,nomeDe:x.nomeDe||(x.snap&&!x.nome?x.snap.nomeDe||'':''),descr:x.descr||'',portata:x.portata,prezzo:x.prezzo,mezza:x.mezza!=null?x.mezza:null,man:man})); out.n++; });
  if(da.fisso&&!m.fisso) m.fisso=clona(da.fisso);
  return out; }

function nuovoStatoOggi(vuoto){
  S.locale=locale0(vuoto); S.portateExtra=[]; S.imp=null; S.invito=null; S.tavoli=null; S.tavoliNumeri=true; S.tavoliStampati=false; S.prezzi={}; S.storico={}; S.menu={}; S.oggiGiorno=null; S.oggiAperto=null; S.pronte=[]; S.registro=reg0(vuoto); sigillaRegistro(); S.consumoFatto=chiaveGiorno(new Date()); S.consumati=null;
  if(vuoto) return;

  (function(){ var o=chiaveGiorno(new Date()); S.pronte=[{id:'pr1',ric:'fondo',q:1,fatto:piuGiorni(o,-2),entro:o,tipo:'frigo',chi:'Lia Prova'},{id:'pr2',ric:'brodocarne',q:2,fatto:piuGiorni(o,-1),entro:piuGiorni(o,1),tipo:'frigo',chi:'Nico Prova'},{id:'pr3',ric:'brodo',q:1.5,fatto:piuGiorni(o,-20),entro:piuGiorni(o,70),tipo:'congelato',chi:'Tea Prova'}]; })();
  for(var id in PREZZI_ESEMPIO) S.prezzi[id]=PREZZI_ESEMPIO[id];
  var oggi=new Date(); oggi.setHours(12,0,0,0);
  for(var id2 in STORICO_ESEMPIO){ var u=STORICO_ESEMPIO[id2][0], ogni=STORICO_ESEMPIO[id2][1], d=u;
    while(d<=42){ var x=new Date(oggi.getTime()-d*864e5); if(S.locale.chiuso.indexOf(x.getDay())<0){ var kk=chiaveGiorno(x); S.storico[kk]=S.storico[kk]||{pranzo:[],cena:[]}; S.storico[kk].pranzo.push({ric:id2,prezzo:PREZZI_ESEMPIO[id2]}); }
      if(!ogni) break; d+=ogni; } }
  /* «usi» = volte nel menu negli ultimi 30 giorni, dallo storico */
  S.ricette.forEach(function(r){ var n=0; Object.keys(S.storico).forEach(function(kk){ if(giorniFa(kk)<=30) S.storico[kk].pranzo.forEach(function(x){if(x.ric===r.id)n++;}); }); r.usi=n; });
  var g=giorni().filter(function(d){return !chiuso(d.k);});
  var metti=function(k,serv,ids,stato){ ids.forEach(function(id){aggiungiAlMenu(k,serv,id,true);}); menuDi(k,serv,true).stato=stato; };
  metti(g[0].k,'pranzo',['insalataformaggella','risotto','brasato','polenta','tortapane'],'online');
  menuDi(g[0].k,'pranzo').fisso={nome:'Menu del giorno',comp:[{portate:['Primi','Secondi'],prezzo:39},{portate:['Antipasti','Primi'],prezzo:33}]};
  metti(g[1].k,'pranzo',['zuppacastagne','persico','pannacotta'],'bozza');
  menuDi(g[1].k,'pranzo').piatti.push(nuovoPiatto({nome:'Polenta con funghi e formaggella',nomeDe:'Polenta mit Pilzen und Formaggella',descr:'Piatto del giorno',portata:'Secondi',prezzo:21,man:{all:['Latte'],nessuno:false,carne:false,prov:'',veg:false}}));
  if(g[2]) metti(g[2].k,'pranzo',['risottoporcini','coniglio','verza'],'bozza');
  /* una cena il venerdì (piano, sezione 9) */
  var ven=giorni().filter(function(d){return dataDa(d.k).getDay()===5&&!chiuso(d.k);})[0];
  if(ven) metti(ven.k,'cena',['vitellotonnato','pappardellecervo','ossobuco','polenta','tortapane'],'bozza');
  S.locale.primoPubblica=false; /* il menu di oggi è già stato pubblicato una volta */
}

    if(ch==='"'&&!c) q=true; else if(ch===sep){ r.push(c); c=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&t[i+1]==='\n') i++; r.push(c); righe.push(r); r=[]; c=''; } else c+=ch; }

/* un file → {tipo, righe} oppure {errore}; righe = [{t, liv, pagina, foglio, toc, bold, cella}] */
async function impLeggiFile(file){ var nome=impTagliaNome(file.name);
  try{ if(file.size>IMP_MAX_FILE) return {errore:'troppo grande per il prototipo.'};
    var testa=await impBytes(file,0,16), tipo=impFirma(testa,file.name), cont={n:0};
    if(tipo==='vecchio') return {errore:'è un formato vecchio (o ha una password). Aprilo e salvalo come Word (.docx) o Excel (.xlsx).'};
    if(tipo==='pdf') return {errore:'è un PDF: aprilo, seleziona il testo, copialo e incollalo qui.',guida:true};
    if(tipo==='foto') return {errore:'è una foto: copia il testo con il telefono e incollalo qui.',guida:true};
    if(tipo==='rtf') return {errore:'aprilo e salvalo come Word (.docx).'};
    if(tipo==='json') return {tipo:'json',testo:impDecodifica(await impBytes(file,0,file.size))};
    if(tipo==='zip'){ var ind=await impZipIndice(file);
      if(ind['word/document.xml']||/\.docx$/i.test(file.name)&&!ind['xl/workbook.xml']) return {tipo:'word',righe:await impDocx(file,ind,cont)};

      if(ind['content.xml']) return {errore:'è un file di LibreOffice: salvalo come Word (.docx) o Excel (.xlsx).'};
      if(ind['Index/Document.iwa']||ind['index.xml']||Object.keys(ind).some(function(k){return /^Index\//.test(k);})) return {errore:'è un file di Pages o Numbers: esportalo come Word o Excel.'};
      return {errore:'non è un file Word o Excel.'}; }
    if(file.size>IMP_MAX_PARTE) return {errore:'troppo grande per il prototipo.'};
    var t=impDecodifica(await impBytes(file,0,file.size));
    if(tipo==='csv') return {tipo:'excel',fogli:[{nome:'',righe:impCsv(t)}],csv:true};
    if(/[\u0000-\u0008\u000E-\u001F]/.test(t.slice(0,2000))) return {errore:'non è un file di testo, Word o Excel.'};
    return {tipo:'testo',righe:t.split(/\r?\n/).map(function(x){ var o={t:x.replace(RE_WHATSAPP,'')}; if(RE_WHATSAPP.test(x)) o.wa=true; return o; })};
  }catch(e){ return {errore:e&&e.perChef?String(e.message).replace(/^./,function(c){return c.toLowerCase();}):'non si legge.'}; } }

/* ---------- versione 10: le tabelle (Word, Excel, testo incollato da Excel) diventano righe che l'incolla capisce ----------

var IMP_H_U=/^(unit[aà]( di misura)?|u\.?\s?m\.?|um|misura|einheit|eh)\.?$/i;
var IMP_H_VIA=/(prezz|cost|chf|fr\.|€|eur\b|preis|kosten|importo|totale|summe|%|^cod|^codice|^art\.?\s*n|^nr\.?$|^n\.$|^#$|^pos\.?$)/i;
var IMP_NUM=/^\d+(?:[.,'’]\d+)*$|^\d+\/\d+$|^\d+\s+\d+\/\d+$|^\d*\s*[½¼¾⅓⅔]$/;

function impNumUnita(c){ var m=String(c||'').trim().match(/^(\d+(?:[.,'’]\d+)*|\d*\s*[½¼¾⅓⅔])\s*([a-zA-Z]+\.?)$/); return m&&impUnita(m[2])?[m[1],m[2]]:null; }

  celle.forEach(function(c,k){ var x=String(c||'').trim(); if(!x) return;
    if(m.nome<0&&IMP_H_NOME.test(x)) m.nome=k;
    else if(IMP_H_Q.test(x)&&!IMP_H_VIA.test(x)) qs.push([k,x]);
    else if(m.u<0&&IMP_H_U.test(x)) m.u=k;

  var uh=q[1].match(/\(\s*(g|gr|kg|l|lt|dl|cl|ml|pz)\s*\)|\bin\s+(g|gr|kg|l|lt|dl|cl|ml)\b|\s(g|gr|kg|l|lt|dl|cl|ml)\s*$/i); if(uh) m.uq=(uh[1]||uh[2]||uh[3]).toLowerCase();
