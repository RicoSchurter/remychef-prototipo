          curl -fsS -X POST "https://sjsamldxbbvuodcphxop.supabase.co/rest/v1/rpc/ping" -H "apikey: sb_publishable_J48n_Qj7a3Hc2vHp1ctWow_jMjmCP3B" -H "Content-Type: application/json" -d '{}'
